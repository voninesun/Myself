# 解锁了「模块」功能的用户可以使用 General.sgmodule 后可移除 [URL Rewrite] 及 [MITM] 的「hostname = www.google.cn,api.abema.io」部分
# 建议使用 General.sgmodule，其他 .sgmodule 按需加入
# 未解锁「模块」功能的用户不要删除以下内容，参照
# (https://github.com/DivineEngine/Profiles/tree/master/Surge)使用快捷指令更新相关内容。

[URL Rewrite]
# 有两种重定向方式: 'header' 和 '302'
# 建议用模块

[MITM]
skip-server-cert-verify = true
hostname = *.biliapi.*, *.bilibili.*
ca-passphrase = F4D084F7
ca-p12 = 

[Script]
# 显示运行时间及MitM等功能开关状态
EDC_Surge-Panel = type=generic,script-path=https://raw.githubusercontent.com/erdongchanyo/Rules/main/Surge/Panels/EDC_Surge-Panel.js,argument=icon=crown.fill&color=#f6c970,script-update-interval=0

[Panel]
# macOS不生效
# > EDC_Surge-Panel
# 显示运行时间及MitM等功能开关状态
# 点击刷新为重载配置
EDC_Surge-Panel = script-name=EDC_Surge-Panel,update-interval=1
