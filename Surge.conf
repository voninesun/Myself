RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/TestFlight/TestFlight.list,TestFlight,no-resolve
# >Apple
# 大部分苹果CDN 服务（如应用商店下载、操作系统和补丁的更新）都使用了在国内 ICP 备案的域名、并在国内有 CDN 节点。这个规则集就是收集了这些可以使用国内直连访问的域名。
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cdn.conf,DIRECT,no-resolve
# 云上贵州（icloud.com.cn）和苹果地图国内版等服务的域名，这部分域名需要国内直
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT
# 排除了有国内 CDN 节点的域名和国区专用域名以后，苹果其余的域名。
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,Apple,extended-matching
# Apple全集
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple_All_No_Resolve.list,Apple,extended-matching
# Google
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google,no-resolve
# Microsoft
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list,Microsoft,no-resolve
# 网易云音乐
RULE-SET,https://raw.githubusercontent.com/deezertidal/Surge_Module/master/rule/NetEaseMusic.list,网易音乐
# Weibo
